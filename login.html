<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Controle de Ativos TI | Village Cepam</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e2022;
            background-image: radial-gradient(circle at 50% 30%, #2d3748 0%, #1a202c 100%);
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border-top: 5px solid #c53030;
            text-align: center;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #c53030;
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 6px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(197, 48, 48, 0.3);
        }

        .brand-village {
            font-weight: 900;
            font-style: italic;
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .brand-cepam {
            font-size: 15px;
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            padding-left: 8px;
            font-weight: 400;
        }

        .login-title {
            color: #2d3748;
            font-size: 20px;
            font-weight: 700;
            margin: 10px 0 4px 0;
        }

        .login-subtitle {
            color: #718096;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            color: #2d3748;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: #e53e3e;
            box-shadow: 0 0 0 3px rgba(229, 62, 62, 0.15);
        }

        .btn-login {
            width: 100%;
            background: #e53e3e;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(229, 62, 62, 0.25);
        }

        .btn-login:hover {
            background: #c53030;
        }

        .btn-login:active {
            transform: scale(0.99);
        }

        .login-footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #edf2f7;
            font-size: 12px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logo Cepam / Village -->
        <div class="brand-badge">
            <span class="brand-village">Village</span>
            <span class="brand-cepam">Cepam</span>
        </div>

        <h2 class="login-title">Acesso ao Sistema</h2>
        <p class="login-subtitle">Controle e Gestão de Ativos de TI</p>

        <form id="formLogin">
            <div class="form-group">
                <label for="email">E-mail Corporativo</label>
                <input type="email" id="email" class="input-field" placeholder="seu.nome@cepam.com.br" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" class="input-field" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login">Entrar no Sistema</button>
        </form>

        <div class="login-footer">
            © Panificadora Cepam / Village • Departamento de TI
        </div>
    </div>

   <!-- Script de Autenticação Correto (Formato JSON) -->
    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            
            // Extrai e formata o nome do usuário
            let nomeUsuario = email.split('@')[0];
            nomeUsuario = nomeUsuario.charAt(0).toUpperCase() + nomeUsuario.slice(1);
            if (!nomeUsuario) nomeUsuario = "Administrator";

            // Cria o objeto JSON que o script.js exige na linha 9
            const usuarioObjeto = {
                nome: nomeUsuario,
                email: email
            };

            // Salva convertido em Texto JSON
            localStorage.setItem('usuarioLogado', JSON.stringify(usuarioObjeto));

            // Redireciona para o painel principal
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>

</body>
</html>
